<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <title>AICAIML — All India Council for Artificial Intelligence & Machine Learning</title>
    <meta name="description" content="AICAIML is India's national council for Artificial Intelligence, Machine Learning, and Robotics — offering free and membership-gated online courses, verifiable digital certification, and academia-industry partnerships to students, professionals, and institutions across India." />

    <!--
      Canonical/OG URLs use a placeholder domain — the codebase itself has two
      different domain variants in use (aicaiml.org in db.ts/server.ts dev
      seed data, aic-aiml.org in Contact.tsx and the enquiry email fallback).
      Replace https://www.aicaiml.org below with the confirmed production
      domain before shipping.
    -->
    <link rel="canonical" href="https://www.aicaiml.org/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AICAIML" />
    <meta property="og:title" content="AICAIML — All India Council for Artificial Intelligence & Machine Learning" />
    <meta property="og:description" content="India's national council for AI, Machine Learning, and Robotics education — free and membership courses, verifiable certification, and academia-industry partnerships." />
    <meta property="og:url" content="https://www.aicaiml.org/" />
    <meta property="og:image" content="/favicon.png" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="AICAIML — All India Council for Artificial Intelligence & Machine Learning" />
    <meta name="twitter:description" content="India's national council for AI, Machine Learning, and Robotics education — free and membership courses, verifiable certification, and academia-industry partnerships." />
    <meta name="twitter:image" content="/favicon.png" />

    <!-- Preconnect first so the font request starts as early as possible,
         instead of being discovered only after index.css finishes parsing
         (the previous @import in index.css was render-blocking and put the
         font request at the end of the CSS waterfall). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "All India Council for Artificial Intelligence and Machine Learning",
        "alternateName": "AICAIML",
        "url": "https://www.aicaiml.org/",
        "logo": "/favicon.png",
        "email": "info@aic-aiml.org",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "7th Floor, Innovation Tower, Block B, Institutional Area, Sector 62",
          "addressLocality": "Noida",
          "addressRegion": "Uttar Pradesh",
          "postalCode": "201301",
          "addressCountry": "IN"
        },
        "sameAs": [
          "https://linkedin.com",
          "https://twitter.com",
          "https://youtube.com"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
